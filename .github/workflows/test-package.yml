name: Test package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify import and CLI entry point
        run: |
          python -c "import FluxTime; assert callable(FluxTime.main)"
          python -c "from importlib.metadata import entry_points; eps = entry_points(group='console_scripts'); assert any(ep.name == 'fluxtime' and ep.value == 'FluxTime:main' for ep in eps)"
