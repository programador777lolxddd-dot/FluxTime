[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxtime-clock"
version = "0.1.0"
description = "A futuristic neon digital clock for your terminal."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Programador en español" }
]
keywords = ["clock", "terminal", "cli", "digital-clock", "ansi", "truecolor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: Terminals",
]

[project.scripts]
fluxtime = "FluxTime:main"

[tool.setuptools]
py-modules = ["FluxTime"]
